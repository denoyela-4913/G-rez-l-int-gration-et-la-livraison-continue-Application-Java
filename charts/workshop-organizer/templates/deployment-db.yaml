apiVersion: apps/v1
kind: Deployment
metadata:
  # Mêmes noms que les manifestes de k8s/ : un seul environnement par namespace, et le script de
  # test fonctionne avec les deux méthodes de déploiement.
  name: workshop-organizer-db-deployment
  labels:
    {{- include "workshop-organizer.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate : l'ancien pod est arrêté AVANT de démarrer le nouveau (deux PostgreSQL sur les mêmes
  # fichiers peuvent les corrompre).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workshop-organizer-db
  template:
    metadata:
      labels:
        app: workshop-organizer-db
        {{- include "workshop-organizer.labels" . | nindent 8 }}
    spec:
      containers:
      - name: workshop-organizer-db
        image: {{ .Values.db.image | quote }}
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: password
        - name: POSTGRES_DB
          value: {{ .Values.db.database | quote }}
        # Sous-dossier du volume : la racine d'un volume peut contenir "lost+found", et PostgreSQL refuse
        # d'initialiser une base dans un dossier non vide.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # Port d'écoute de PostgreSQL : doit être celui du Service et de l'URL JDBC.
        - name: PGPORT
          value: {{ .Values.db.port | quote }}
        ports:
        - containerPort: {{ .Values.db.port }}
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        {{- if .Values.db.persistence.enabled }}
        persistentVolumeClaim:
          claimName: workshop-organizer-db-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
