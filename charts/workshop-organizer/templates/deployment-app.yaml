apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-organizer-app-deployment
  labels:
    {{- include "workshop-organizer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: workshop-organizer-app
  template:
    metadata:
      labels:
        app: workshop-organizer-app
        {{- include "workshop-organizer.labels" . | nindent 8 }}
    spec:
      {{- if .Values.app.imagePullSecret }}
      # Rendu seulement si une valeur est donnée : registre privé.
      imagePullSecrets:
      - name: {{ .Values.app.imagePullSecret }}
      {{- end }}
      # Attend que la base accepte les connexions avant de lancer l'application. Sans cela, l'application
      # démarre (~3 s) avant que le Service de la base ait une adresse (il n'en a que quand la base est
      # prête, grâce à sa readinessProbe), échoue à se connecter et est redémarrée par Kubernetes.
      # pg_isready résout le NOM du Service : il attend donc aussi que ce nom existe dans le DNS.
      initContainers:
      - name: wait-for-db
        image: {{ .Values.db.image | quote }}
        command:
        - sh
        - -c
        - until pg_isready -h workshop-organizer-db-service -p {{ .Values.db.port }}; do echo "en attente de la base..."; sleep 2; done
      containers:
      - name: workshop-organizer-app
        image: {{ required "app.image est obligatoire (ex. ghcr.io/utilisateur/image:0.3.1) : utiliser -f values-dev.yaml ou --set app.image=..." .Values.app.image | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.app.port }}
        {{- if .Values.app.probes.enabled }}
        # Démarrage : tant qu'elle n'a pas réussi, les deux autres sondes sont suspendues.
        startupProbe:
          httpGet:
            path: {{ .Values.app.probes.path }}
            port: http
          {{- toYaml .Values.app.probes.startup | nindent 10 }}
        # Prêt : en cas d'échec, le pod est retiré du Service, sans être redémarré.
        readinessProbe:
          httpGet:
            path: {{ .Values.app.probes.path }}
            port: http
          {{- toYaml .Values.app.probes.readiness | nindent 10 }}
        # Vivant : en cas d'échec, le conteneur est redémarré. Volontairement sur la même route que
        # readiness (pas une route qui dépend de la database) : une panne de la database ne doit pas faire
        # redémarrer l'application.
        livenessProbe:
          httpGet:
            path: {{ .Values.app.probes.path }}
            port: http
          {{- toYaml .Values.app.probes.liveness | nindent 10 }}
        {{- end }}
        {{- if .Values.app.preStopSeconds }}
        # Pause avant l'arrêt d'un pod : au moment où Kubernetes arrête l'ancien pod lors d'une mise à jour, le Service
        # n'a pas encore fini de le retirer de sa liste. Sans pause, les requêtes encore envoyées à ce pod échouent
        # (mesuré : environ 2 s de coupure). Pendant ces secondes, le pod continue de répondre.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", {{ .Values.app.preStopSeconds | quote }}]
        {{- end }}
        env:
        - name: SPRING_DATASOURCE_URL
          # Le nom d'hôte est celui du Service de la base (service-db.yaml), résolu par le DNS du cluster.
          value: {{ printf "jdbc:postgresql://workshop-organizer-db-service:%v/%s" .Values.db.port .Values.db.database | quote }}
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: password
