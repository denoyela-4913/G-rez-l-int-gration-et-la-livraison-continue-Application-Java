# Identifiants de la base, lus par la base (POSTGRES_USER / POSTGRES_PASSWORD) ET par l'application
# (SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD) : une seule source, ils ne peuvent pas diverger.
apiVersion: v1
kind: Secret
metadata:
  name: workshop-organizer-db-secret
  labels:
    {{- include "workshop-organizer.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.db.username | b64enc | quote }}
  password: {{ required "db.password est obligatoire : utiliser --set db.password=... (ou un fichier de valeurs)" .Values.db.password | b64enc | quote }}
