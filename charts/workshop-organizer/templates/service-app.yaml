apiVersion: v1
kind: Service
metadata:
  name: workshop-organizer-app-service
  labels:
    {{- include "workshop-organizer.labels" . | nindent 4 }}
spec:
  selector:
    app: workshop-organizer-app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.app.port }}
  type: {{ .Values.service.type }}
