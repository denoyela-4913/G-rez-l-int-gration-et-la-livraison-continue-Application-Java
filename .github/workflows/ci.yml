# Pipeline CI : exécute les tests unitaires via ./run-tests.sh et publie le rapport JUnit, puis
# (sur push) construit l'image Docker, la teste et la publie sur GHCR (GitHub Container Registry).
# Le même script run-tests.sh et le même chemin de rapport (test-results/xml/) sont utilisés
# dans le projet Angular : seule l'étape d'installation de l'environnement diffère.
# Toutes les actions sont fixées sur le SHA d'un commit (le commentaire donne la version).
# Les mises à jour sont proposées par Dependabot (.github/dependabot.yml), sous forme de pull requests.
name: CI

on:
  push:
    # Les tags git (vX.Y.Z) sont créés par semantic-release : les ignorer évite qu'un tag poussé à la
    # main ne soit pris pour une branche et ne produise une image Docker au nom parasite (ex. v0.2.4-206db09).
    tags-ignore: ['**']
  pull_request:

# Droits minimaux du GITHUB_TOKEN. "checks: write" permet de publier le rapport de tests
# dans l'onglet Checks de la pull request / du commit.
permissions:
  contents: read
  checks: write

# Une nouvelle exécution sur la même branche annule la précédente encore en cours.
# Sur main, on n'annule jamais un run en cours : il peut être en train de créer une release (tag + commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Variables du workflow. Le nom de l'image peut être changé sans modifier ce fichier, via la variable
# de dépôt IMAGE_NAME (Settings > Secrets and variables > Actions > Variables) ; défaut : le dépôt.
env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04 # version fixée (pas "latest") pour un environnement stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle # cache des dépendances Gradle (~/.gradle), clé basée sur les fichiers Gradle

      - name: Exécuter les tests
        run: ./run-tests.sh

      # if: always() : le rapport est publié même si les tests échouent (c'est là qu'on en a besoin).
      - name: Publier le rapport de tests
        if: always()
        # Action tierce : fixée sur le SHA du commit (tag v6.6.1), car un tag peut être déplacé.
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: test-results/xml/*.xml # JUnit XML (Gradle et Karma)
          check_name: Rapport de tests

      - name: Conserver les rapports (XML + HTML)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  # Calcule la prochaine version à partir des messages de commit (Conventional Commits) avec
  # semantic-release, puis crée le commit de version, le tag vX.Y.Z et la release GitHub.
  # La configuration est dans .releaserc.json. Uniquement sur un push sur main, après les tests.
  # Si aucun commit "feat:" ou "fix:" n'est arrivé depuis le dernier tag, il ne fait rien (pas de release).
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Droit d'écriture nécessaire pour pousser le commit de version et le tag, et créer la release.
    permissions:
      contents: write
    # Version créée (vide si aucune release) : utilisée par le job "build" pour tagger l'image.
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # fetch-depth: 0 : semantic-release lit tout l'historique et les tags (par défaut, seul le
      # dernier commit est récupéré, il ne trouverait aucun tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node 24 : le plugin @semantic-release/git exige Node >= 24.15 (ou 22.22.2+).
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Versions fixées (pas de "latest") : un résultat reproductible. Pas d'action tierce : npx
      # télécharge directement les paquets npm officiels.
      - name: Publier la release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/commit-analyzer@13.0.1 \
            -p @semantic-release/release-notes-generator@14.1.1 \
            -p @semantic-release/exec@7.1.0 \
            -p @semantic-release/git@11.0.1 \
            -p @semantic-release/github@12.0.10 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release

  # Construit l'image Docker, vérifie qu'elle fonctionne, puis la publie sur GHCR
  # (GitHub Container Registry). Le job "test" doit réussir avant (needs) : on ne publie jamais
  # une image issue d'un code dont les tests échouent.
  # Uniquement sur "push" : sur une pull request, le push est inutile (et interdit pour un fork).
  build:
    needs: [test, release]
    # "release" est ignoré hors de main : sans cette condition, "build" serait ignoré lui aussi.
    # Il doit en revanche réussir (ou être ignoré) : on ne construit pas si la release a échoué.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Un "permissions" au niveau du job remplace celui du workflow : on redonne la lecture du code
    # et on ajoute "packages: write" (nécessaire pour pousser sur ghcr.io), uniquement ici.
    permissions:
      contents: read
      packages: write
    steps:
      # Si une release vient d'être créée, on construit le tag vX.Y.Z : il contient le commit de version
      # (build.gradle et Dockerfile à jour). Sinon, on construit le commit qui a déclenché le run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version && format('v{0}', needs.release.outputs.version) || github.sha }}

      # Les valeurs saisies par un utilisateur (nom de branche) passent par "env:" puis par une
      # variable shell, jamais par ${{ }} dans le script : sinon un nom de branche piégé
      # s'exécuterait comme du code (injection de script).
      - name: Calculer le nom et les tags de l'image
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
        run: |
          # Commit réellement construit : github.sha, ou le commit de version si une release a été créée.
          SHA=$(git rev-parse HEAD)
          echo "SHA=${SHA}" >> "$GITHUB_ENV"
          # Tag de version (ex. 0.3.0), seulement quand une release vient d'être créée.
          echo "VERSION_TAG=${VERSION}" >> "$GITHUB_ENV"
          # Un tag Docker n'accepte ni majuscule ni "/" : "feature/Ma-Branche" -> "feature-ma-branche".
          branch=$(echo "$REF_NAME" | tr 'A-Z' 'a-z' | sed 's#[^a-z0-9_.-]#-#g; s#^[.-]*##')
          # ${IMAGE_NAME,,} : un nom d'image doit être en minuscules (le dépôt contient des majuscules).
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${branch}" >> "$GITHUB_ENV"
          echo "SHA_TAG=${branch}-${SHA::7}" >> "$GITHUB_ENV"

      # Deux tags : "<branche>" (mobile, pointe sur le dernier commit) et "<branche>-<sha>"
      # (immuable, identifie exactement le commit). Les labels OCI relient l'image au dépôt,
      # ce qui rattache le paquet GHCR à ce dépôt (droits et visibilité).
      - name: Construire l'image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tags=(-t "${IMAGE}:${BRANCH_TAG}" -t "${IMAGE}:${SHA_TAG}")
          if [ -n "${VERSION_TAG}" ]; then tags+=(-t "${IMAGE}:${VERSION_TAG}"); fi
          docker build \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            "${tags[@]}" .

      # Test de fonctionnement AVANT publication. L'application a besoin de PostgreSQL : on utilise
      # donc docker-compose.yml (app + db). On donne à l'image construite le nom attendu par le
      # compose, et --no-build l'empêche de la reconstruire : on teste bien l'image qui sera publiée.
      # --wait attend que les healthchecks (db, puis app) passent et échoue sinon.
      - name: Tester l'image avec sa base de données
        run: |
          # Donne à l'image construite le nom que docker-compose.yml attend (workshop-organizer:latest),
          # pour que le compose utilise cette image au lieu d'en reconstruire une.
          docker tag "${IMAGE}:${SHA_TAG}" workshop-organizer:latest

          # Test 1 : l'application et PostgreSQL démarrent ensemble. --no-build : pas de reconstruction ;
          # --wait : attend que les healthchecks passent (db puis app) et échoue au bout de 120 s sinon.
          # Une application qui ne se connecte pas à la base ne devient jamais "healthy".
          docker compose up -d --no-build --wait --wait-timeout 120

          # Test 2 : l'API répond sur le port 8080 (-f : un code HTTP >= 400 est une erreur).
          curl -fsS -o /dev/null http://localhost:8080/

          # Test 3 : le conteneur ne tourne pas en root. -T : pas de terminal (inexistant en CI).
          # 10001 est l'UID de l'utilisateur "workshop" du Dockerfile, jamais 0 (root).
          test "$(docker compose exec -T app id -u)" = "10001"

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker compose logs

      # Le GITHUB_TOKEN du job suffit pour pousser (droit packages: write). Le mot de passe passe
      # par l'entrée standard pour ne pas apparaître dans la liste des processus.
      - name: Se connecter à GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Publier l'image
        run: |
          docker push "${IMAGE}:${BRANCH_TAG}"
          docker push "${IMAGE}:${SHA_TAG}"
          if [ -n "${VERSION_TAG}" ]; then docker push "${IMAGE}:${VERSION_TAG}"; fi
          echo "Image publiée : ${IMAGE}:${SHA_TAG}" >> "$GITHUB_STEP_SUMMARY"
