apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-organizer-db-deployment
spec:
  replicas: 1
  # Recreate : l'ancien pod est arrêté AVANT de démarrer le nouveau. Avec la stratégie par défaut
  # (RollingUpdate), le nouveau pod démarrerait pendant que l'ancien tourne encore : deux PostgreSQL
  # sur les mêmes fichiers, ce qui peut les corrompre (et un volume ReadWriteOnce ne se monte pas deux fois).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workshop-organizer-db
  template:
    metadata:
      labels:
        app: workshop-organizer-db
    spec:
      containers:
      - name: workshop-organizer-db
        # Même version de PostgreSQL que docker-compose.yml.
        image: postgres:13
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: password
        - name: POSTGRES_DB
          value: workshop-organizer-database
        # Sous-dossier du volume : la racine d'un volume peut contenir un dossier "lost+found", et
        # PostgreSQL refuse d'initialiser une base dans un dossier non vide.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        # Prêt = PostgreSQL accepte les connexions EN TCP (-h 127.0.0.1). Pendant son initialisation, l'image
        # démarre un serveur temporaire sans TCP (uniquement un socket local) : sans -h, pg_isready passerait par
        # ce socket et répondrait "prêt" alors que la base n'existe pas encore.
        # Pas de livenessProbe : redémarrer une base sur une fausse alerte est plus risqué que d'attendre.
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -p "${PGPORT:-5432}" -U "$POSTGRES_USER"
          # 2 s : la base est prête dès qu'elle accepte les connexions, sans attendre jusqu'à 5 s de plus.
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 3
        # Monte le volume là où PostgreSQL écrit ses fichiers.
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: workshop-organizer-db-pvc
